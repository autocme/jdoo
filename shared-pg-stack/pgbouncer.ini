; =============================================================================
; PgBouncer — session pooling for the shared Postgres (one per worker node)
; =============================================================================
; pool_mode=session is REQUIRED and must never change. Odoo holds two PERMANENT
; LISTEN sessions per tenant — odoo/service/server.py WorkerCron.start()
; (LISTEN cron_trigger) and addons/bus/models/bus.py ImDispatch.loop()
; (listen imbus) — and BOTH are opened against the `postgres` database, not the
; tenant's own. LISTEN/NOTIFY state and prepared statements are per-session, so
; transaction pooling would silently break Discuss, the websocket bus and every
; cron trigger. Session mode is also why the numbers below have to be explicit:
; a held session is never returned to the pool, so server_idle_timeout and
; server_lifetime never reclaim it.
;
; NOTE: PgBouncer does NOT support inline (trailing) comments — every ';' comment
; must be on its OWN line. A trailing comment becomes part of the VALUE.
;
; -----------------------------------------------------------------------------
; CAPACITY BUDGET  (asserted by tests/test_proxy_and_pool.sh — keep in sync)
;   PostgreSQL max_connections .................. 500   (PG_MAX_CONNECTIONS)
;   superuser_reserved_connections ...............-10   (PG_SUPERUSER_RESERVED)
;   available to PgBouncer ....................... 490
;
;   tenant DBs via the wildcard  18 x 19 ......... 342
;   sub8 (explicit)               1 x 30 ..........  30
;   sub7 (explicit)               1 x 22 ..........  22
;   postgres                      1 x 60 ..........  60
;   pgb_auth_lookup               1 x 6 ...........   6
;   TOTAL ........................................ 460   (30 spare)
;
; MEASURED on jaah-w1. The first version of these numbers was measured during a
; QUIET period and was wrong in a way that cost a customer three hours, so the
; correction is recorded here rather than quietly overwritten:
;
;   * 2026-09-29, first measurement: "a tenant's peak was 12 server connections
;     (sub8, sub13)", from which a cap of 18 was called 1.5x headroom.
;   * 2026-09-29, from the POOLER'S OWN LOG for the hours after that cap went
;     live: sub8's pool climbed to 15 at 08:22:40, reached 18 — the cap — at
;     09:35:49, and stayed at 17-18 until 13:18. PgBouncer then closed 31 of its
;     clients with `query_wait_timeout (age=60s)`, each after a full minute of
;     waiting. For the customer that is a page that hangs for a minute and then
;     fails. sub8 also took a reserve slot 26 times; sub7 5, sub5 2, sub13 1.
;   * The same day, sub18 lost 3 clients the same way while an administrator was
;     uninstalling a module: the uninstall itself succeeded, and then the request
;     died on `server closed the connection unexpectedly` during the registry
;     rebuild. Long administrative work (uninstall, upgrade, import) saturates a
;     pool by its nature, so the cap has to survive it, not just steady traffic.
;   * The lesson for whoever measures next: cl_waiting and maxwait read LIVE are
;     zero between peaks. They cannot show a peak that has passed. Read the
;     pooler's log.
;
; WHY sub8 AND sub7 GET THEIR OWN ENTRIES, instead of raising the cap for all:
; the ceiling above is what it is because PG_MAX_CONNECTIONS is 500, so a uniform
; increase buys every tenant about two connections and the busy one still runs
; out. Two explicit entries give the tenants that actually reached the cap real
; headroom (sub8 +67%) and leave 30 spare. Adding a tenant through the wildcard
; still needs no reload; changing which tenants are heavy does.
;
; WHERE THE CAPACITY CAME FROM: the `postgres` entry was provisioned at 5 server
; connections per tenant back when conf.dbfilter forced a session on every
; database-resolving request. That key is gone, the only remaining use is the two
; permanent LISTEN sessions, and the measurement agrees — 22 sessions across 17
; tenants, 1.3 each. It is now 3 per tenant, which frees 40.
;
; MAX TENANTS PER NODE = 20. Exceeding it, or needing a tenant cap above ~21,
; means raising PG_MAX_CONNECTIONS in the node's .env (and its RAM) — which needs
; a PostgreSQL restart. That is the durable fix for a tenant like sub8, and it is
; not a free knob.
; =============================================================================

[databases]

; --- Tenants -----------------------------------------------------------------
; Wildcard: a client asking for db <t> is proxied to postgres db <t> (same name).
; auth_user runs the auth_query; the actual role/password is resolved per
; connection, so adding or removing a tenant needs NO PgBouncer reload.
; The per-database ceiling for these comes from the global max_db_connections
; below (19). It is deliberately NOT set on this line: limit keys inherited
; through a wildcard template are easy to get wrong, and an explicit global is
; what the test reads. A tenant named explicitly further down leaves this
; ceiling entirely and gets its own.
* = host=postgres port=5432 auth_user=pgbouncer_auth

; --- The maintenance database ------------------------------------------------
; This entry is what the 2026-09-28 fleet-wide login outage was about.
; Odoo reaches `postgres` on three paths:
;   1. WorkerCron.start()       -> LISTEN cron_trigger, held forever
;   2. bus ImDispatch.loop()    -> listen imbus, held forever
;   3. service/db.py list_dbs() -> db_connect('postgres'), on every request that
;      has to resolve a database, because conf.dbfilter being set makes list_dbs
;      skip its `if not dbfilter and db_name: return db_name` short-circuit
;      (odoo/service/db.py:438). That key is being removed, but this entry must
;      hold even if it ever comes back.
; Measured: 44 sessions from 16 tenants on ONE database, against a ceiling of 60.
; Under the old single wildcard entry that database inherited max_db_connections
; = 30, i.e. it was oversubscribed ~4x by design: once full, PgBouncer could no
; longer run auth_query for ANY tenant and every login on the node timed out.
;
; pool_size is per (role, database): each tenant role gets its own pool here, and
; 20 x (pool_size + reserve_pool) == max_db_connections, so a tenant can exhaust
; its own share and nobody else's. THE EQUALITY IS THE STRUCTURAL FIX — any
; change to pool_size, reserve_pool or the cap must keep 20 x (p + r) == cap.
;
; Sized down from 5 per tenant to 3 on 2026-09-29, and the 40 connections that
; freed went to the tenants that were hitting their own cap. Justified by two
; things: conf.dbfilter is gone, so path 3 above no longer happens, and the live
; measurement is 22 sessions across 17 tenants — 1.3 each, against the 2
; permanent LISTEN sessions this now has to serve. If conf.dbfilter is ever set
; again, usage returns to ~2.75 per tenant and 3 is the edge, not headroom: raise
; this entry back before setting it, not after. tests/test_dbfilter_removal.py is
; what keeps that key from coming back unnoticed.
postgres = host=postgres port=5432 dbname=postgres auth_user=pgbouncer_auth pool_size=2 reserve_pool=1 max_db_connections=60

; --- Tenants that outgrew the wildcard ceiling -------------------------------
; Explicit entries, because PgBouncer accounts per [databases] KEY: naming a
; tenant here takes it out of the global max_db_connections and gives it its own
; bucket. Only for tenants MEASURED against the cap in the pooler's log — not for
; ones merely suspected of being busy, because every connection named here is one
; the other 18 cannot have.
;
; sub8: reached the 18 cap and lost 31 clients to query_wait_timeout on
; 2026-09-29. 24 + 6 = 30. Its own erp.conf can demand 4 workers x db_maxconn 8
; plus a cron and a gevent worker, so 30 is not the theoretical maximum either —
; it is 1.67x the measured peak, which is the same ratio the first cap aimed for
; and failed to reach.
sub8 = host=postgres port=5432 dbname=sub8 auth_user=pgbouncer_auth pool_size=24 reserve_pool=6 max_db_connections=30

; sub7: took a reserve slot 5 times the same day, i.e. it passed
; default_pool_size but never reached the cap. Given headroom before it does.
sub7 = host=postgres port=5432 dbname=sub7 auth_user=pgbouncer_auth pool_size=19 reserve_pool=3 max_db_connections=22

; --- auth_query lookup capacity ----------------------------------------------
; Same PHYSICAL database as the entry above, a DIFFERENT PgBouncer database
; object -> a separate max_db_connections bucket, because PgBouncer accounts
; server connections per [databases] KEY, not per real dbname. Tenant traffic on
; `postgres` therefore can no longer starve auth lookups.
;
; No PostgreSQL change is needed, and that is the point: init/00-auth.sh runs
; ONCE, from docker-entrypoint-initdb.d, on first cluster init. It will never run
; again on a live node, so a NEW auth role could not be provisioned without
; manual DDL on every cluster. pgbouncer_auth already exists, its password is
; already in auth_file (written from AUTH_PASS at container start), and it
; already has EXECUTE on pgbouncer_auth.get_auth(). Zero DDL.
;
; DO NOT add `user=pgbouncer_auth` here. `user=` forces the server-side role for
; every client of the entry, so a tenant that guessed this dbname would get a
; session running AS pgbouncer_auth and could call
; pgbouncer_auth.get_auth('<other tenant>') and read another tenant's SCRAM
; verifier. Without `user=`, a tenant reaching this name connects as its own role
; and gains nothing it does not already have on `postgres`.
pgb_auth_lookup = host=postgres port=5432 dbname=postgres auth_user=pgbouncer_auth pool_size=4 reserve_pool=2 max_db_connections=6

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; --- Auth ---
auth_type = scram-sha-256
; auth_file is written from AUTH_PASS by the container entrypoint
auth_file = /tmp/userlist.txt
auth_user = pgbouncer_auth
; Run auth_query against the dedicated lookup entry, NOT against `postgres`.
; pg_authid is cluster-global so the physical database is the same; what changes
; is that the auth pool has capacity tenant load cannot consume. pgbouncer_auth
; itself resolves from auth_file, so there is no lookup recursion. Note the admin
; console database (`pgbouncer`) is NOT a legal value here.
auth_dbname = pgb_auth_lookup
auth_query = SELECT username, password FROM pgbouncer_auth.get_auth($1)

; --- Pooling (auto-adapts to load) ---
; session mode: mandatory. See the header.
pool_mode = session
max_client_conn = 2000
; default_pool_size = per (role,db) CEILING, filled on demand.
; Overridden per database on the two explicit entries above.
default_pool_size = 16
; min_pool_size = 0 -> idle tenants hold ZERO server connections
min_pool_size = 0
reserve_pool_size = 3
reserve_pool_timeout = 3

; Global per-database ceiling. Applies to every tenant database reached through
; the wildcard; the explicit entries above override it. 16 + 3 = 19, so a tenant
; can actually reach its reserve before hitting the cap.
;
; 18 was the first value and it was too low: it was set from a peak of 12
; measured in a quiet hour, and within two hours of going live sub8 had reached
; it and was losing clients. 19 is what the budget allows for 18 wildcard tenants
; once sub8 and sub7 have their own entries; it is a small increase and it is
; honest about that. A tenant that starts hitting 19 needs its own entry, and a
; THIRD tenant needing one means PG_MAX_CONNECTIONS is the real constraint and
; belongs in a maintenance window.
max_db_connections = 19
; Per-role ceiling across ALL databases. It must never bind before the
; per-database caps, or a tenant would be throttled by a limit that says nothing
; about the cluster: sub8 needs 30 (its own entry) + 3 (postgres) = 33, so 30
; would have bound FIRST and silently undone the entry above. 40 leaves room for
; the next explicit entry without another edit here.
max_user_connections = 40
; Reclaim server connections that are genuinely UNUSED. Neither of these can
; touch a held LISTEN session: in session mode a server connection assigned to a
; client is never idle and is never released for recycling.
server_idle_timeout = 300
server_lifetime = 3600
; Queue under saturation instead of erroring. 60s, not 120s: with the ceilings
; above saturation should be rare, and a caller that waits two minutes has
; already lost the user. A short wait surfaces the problem instead of hiding it
; behind a hang.
query_wait_timeout = 60
; NEVER set client_idle_timeout. It would disconnect the permanent LISTEN
; clients, which are idle by definition. Default 0 = disabled. Leave it out.

; --- Dead-peer detection -----------------------------------------------------
; Without these, a LISTEN session whose peer vanished without a FIN (container
; OOM-kill, bridge reset) occupies a slot in the `postgres` pool until the OS
; default keepalive fires — over two hours. ~2 minutes instead.
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 6

; --- Accept queue ------------------------------------------------------------
; Default is 128. After any pgbouncer recreate every tenant process reconnects at
; once; at 20 tenants x ~11 processes x 2 pools the SYN burst overflows 128, and
; the overflow is a connection reset, not a retry. Also clamped by the host
; sysctl net.core.somaxconn, which this repo does not own.
listen_backlog = 1024

; --- Compatibility / admin ---
ignore_startup_parameters = extra_float_digits,options,IntervalStyle
; Console logins resolve only through auth_file (auth_query is not used for the
; `pgbouncer` database), and only pgbouncer_auth is in auth_file. `postgres` is
; listed for the day someone adds it. Deliberately NOT granting admin to
; pgbouncer_auth: the only admin verb we would want is RELOAD, and RELOAD is
; exactly the wrong tool here — a single-file bind mount binds by INODE, so a
; host-side edit that replaces the file (sed -i, git reset --hard) leaves the
; running container holding the OLD inode and RELOAD reports success on stale
; content. Measured on jaah-w1 2026-09-28. Use a container recreate.
admin_users = postgres
; pgbouncer_auth STAYS here. It is the only identity that can authenticate to the
; console, so removing it leaves the node with no SHOW POOLS / SHOW DATABASES
; during the next incident — the README health checks run as this role. Even the
; superuser cannot get in: get_auth() filters `AND NOT rolsuper`, so auth_query
; can never resolve `postgres`. Stats-only, never admin.
stats_users = postgres, pgbouncer_auth

; --- Process ---
; pidfile MUST stay EMPTY. PgBouncer is PID 1 in the foreground here (the compose
; entrypoint execs it with no -d), and a pidfile is only needed to daemonise.
; With one set, the file lives in the CONTAINER's writable layer and survives
; `docker restart`, so every restart dies 0.7s in with
; "FATAL pidfile exists, another instance running?". Observed on this exact
; stack: RestartCount 11062, last healthy check 54 days earlier. Empty = no
; pidfile = that loop is unreachable.
pidfile =
logfile =
