; =============================================================================
; PgBouncer — session pooling for the shared Postgres (one per worker node)
; =============================================================================
; pool_mode=session is REQUIRED: Odoo's bus (Discuss/websocket) uses LISTEN/NOTIFY,
; and prepared statements are held per-session — both break under transaction pooling.
; auth_query + auth_dbname=postgres lets PgBouncer resolve ANY tenant role live from
; pg_authid, so adding/removing a tenant needs NO PgBouncer reload.
; NOTE: PgBouncer does NOT support inline (trailing) comments — every ';' comment must
; be on its OWN line.
; =============================================================================

[databases]
; Wildcard: a client asking for db <t> is proxied to postgres db <t> (same name).
; auth_user runs the auth_query; the actual role/password is resolved per-connection.
* = host=postgres port=5432 auth_user=pgbouncer_auth

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432

; --- Auth ---
auth_type = scram-sha-256
; auth_file is written from AUTH_PASS by the container entrypoint
auth_file = /tmp/userlist.txt
auth_user = pgbouncer_auth
; Always run auth_query against the `postgres` DB (pg_authid is cluster-global), so
; pgbouncer_auth never needs CONNECT on the per-tenant DBs (which REVOKE it from PUBLIC).
auth_dbname = postgres
auth_query = SELECT username, password FROM pgbouncer_auth.get_auth($1)

; --- Pooling (auto-adapts to load) ---
; session mode: LISTEN/NOTIFY + prepared statements work
pool_mode = session
max_client_conn = 2000
; default_pool_size = per (role,db) CEILING, filled on demand
default_pool_size = 25
; min_pool_size = 0 -> idle tenants hold ZERO server connections
min_pool_size = 0
reserve_pool_size = 5
reserve_pool_timeout = 3
; reclaim idle server connections after 300s -> adapt down under low load
server_idle_timeout = 300
server_lifetime = 3600
; queue under saturation instead of erroring
query_wait_timeout = 120

; --- Compatibility / admin ---
ignore_startup_parameters = extra_float_digits,options,IntervalStyle
admin_users = postgres
stats_users = postgres, pgbouncer_auth
pidfile = /tmp/pgbouncer.pid
logfile =
