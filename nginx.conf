# =============================================================================
# jdoo - Nginx Reverse Proxy for Odoo
# =============================================================================
# Routes /websocket/ to gevent worker, everything else to HTTP workers.
# Required when Odoo runs with workers > 0 (multi-processing mode).
#
# Uses envsubst variables: $ODOO_PORT, $ODOO_INTERNAL_PORT, $GEVENT_INTERNAL_PORT
# =============================================================================

# Real client IP: behind a Cloudflare tunnel the visitor address arrives in
# CF-Connecting-IP (remote_addr is the local cloudflared hop, which would make
# Odoo's proxy_mode resolve an internal IP and break GeoIP).
#
# That header is only meaningful when the request actually came through the
# tunnel. Honouring it unconditionally let anyone who could reach the node
# directly — the container network, another tenant's container, anything past
# the edge — send `CF-Connecting-IP: <anything>` and become that address for
# every purpose Odoo derives from it: audit trails, rate limiting, GeoIP, and
# any IP-based access rule. So the header is trusted only from a proxy hop we
# put there ourselves.
geo $from_trusted_proxy {
    default        0;
    127.0.0.0/8    1;   # cloudflared / nginx sidecar on the same netns
    10.0.0.0/8     1;   # Docker overlay (dokploy-network)
    172.16.0.0/12  1;   # Docker default bridge range
    192.168.0.0/16 1;   # LAN-attached deployments
}

map $from_trusted_proxy $trusted_cf_ip {
    default "";                       # untrusted source: ignore the header
    1       $http_cf_connecting_ip;
}

map $trusted_cf_ip $client_real_ip {
    ""      $proxy_add_x_forwarded_for;
    default $trusted_cf_ip;
}

# Same reasoning for the scheme. TLS terminates at the edge, so the internal
# hop is plain http and $scheme reports "http" — Odoo then builds http:// URLs
# and drops the Secure flag on its session cookie. The forwarded value is
# authoritative, but only from a trusted hop; from anyone else it is a
# downgrade primitive.
map $from_trusted_proxy $forwarded_proto_in {
    default "";
    1       $http_x_forwarded_proto;
}

map $forwarded_proto_in $client_proto {
    ""      $scheme;
    default $forwarded_proto_in;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen ${ODOO_PORT} default_server;
    server_name _;

    # Runtime DNS re-resolution of the `odoo` service via Docker's embedded DNS:
    # a recreated odoo container (new IP) is picked up within `valid` instead of
    # nginx caching a stale IP for its whole lifetime and 502-ing. This takes
    # effect only with a VARIABLE in proxy_pass (below) — a name in `upstream {}`
    # is resolved once at config load on open-source nginx. The ordering gate
    # (nginx depends_on odoo: service_healthy) is intentionally kept in compose.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $odoo_http odoo:8069;
    set $odoo_gevent odoo:8072;

    # Increase proxy buffer sizes for Odoo
    proxy_buffers 16 64k;
    proxy_buffer_size 128k;

    # Common proxy headers
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $client_real_ip;
    proxy_set_header X-Forwarded-For $client_real_ip;
    proxy_set_header X-Forwarded-Proto $client_proto;
    proxy_set_header X-Forwarded-Host $http_host;

    # Timeouts
    proxy_connect_timeout 720s;
    proxy_send_timeout 720s;
    proxy_read_timeout 720s;

    # Max upload size (Odoo attachments, imports)
    client_max_body_size 200m;

    # Gzip compression
    gzip on;
    gzip_types text/css text/plain text/xml application/xml application/json
               application/javascript text/javascript image/svg+xml;

    # -------------------------------------------------------------------------
    # WebSocket / LiveChat / Discuss → gevent worker
    # Matches: /websocket, /websocket/, /websocket?version=...
    # -------------------------------------------------------------------------
    location /websocket {
        proxy_pass http://$odoo_gevent;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # nginx quirk: any proxy_set_header here cancels inheritance of the
        # server-level common headers — restate them for websocket requests.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $client_real_ip;
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $client_proto;

        # WebSocket keepalive (24 hours)
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # -------------------------------------------------------------------------
    # Long-polling fallback (older Odoo versions < 16)
    # -------------------------------------------------------------------------
    location /longpolling {
        proxy_pass http://$odoo_gevent;
    }

    # -------------------------------------------------------------------------
    # External RPC is blocked (security, 2026-09-06).
    # /xmlrpc/* and /jsonrpc are Odoo's full remote API: authenticate, read,
    # write, and — via ir.actions.server create+run — execute arbitrary Python
    # (RCE). An incident abused the publicly-exposed endpoint to change tenant
    # user passwords and run code. The browser web client never uses these
    # paths (it calls /web/dataset/* only), so denying them costs nothing on
    # the UI while removing the entire attack surface. Legitimate server-to-
    # server integrations, if ever needed, get an allow-listed source instead.
    # -------------------------------------------------------------------------
    location ~ ^/(xmlrpc|jsonrpc) {
        return 403;
    }

    # -------------------------------------------------------------------------
    # Everything else → HTTP workers
    # -------------------------------------------------------------------------
    location / {
        proxy_pass http://$odoo_http;
        proxy_redirect off;
    }
}
